name: Astra Eaglercraft Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Astra
        uses: actions/checkout@v4

      - name: Checkout Eaglercraft 26.3 baseline
        uses: actions/checkout@v4
        with:
          repository: Axellgamer/Eaglercraft-26.3
          ref: main
          path: eaglercraft

      - name: Apply Astra source overlay
        run: |
          chmod +x tools/apply-astra.sh
          ./tools/apply-astra.sh eaglercraft

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile game sources
        working-directory: eaglercraft
        run: ./gradlew :game:compileJava --console=plain --no-daemon
