name: Galaxy Client Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-pages
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Galaxy Client
        uses: actions/checkout@v4

      - name: Checkout Eaglercraft 26.3 baseline
        uses: actions/checkout@v4
        with:
          repository: Axellgamer/Eaglercraft-26.3
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: eaglercraft

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Check and apply Galaxy source overlay
        run: |
          chmod +x tools/apply-astra.sh
          ./tools/apply-astra.sh eaglercraft

      - name: Compile game sources
        working-directory: eaglercraft
        run: ./gradlew :game:compileJava --console=plain --no-daemon

      - name: Build WebAssembly GC client
        working-directory: eaglercraft
        run: ./gradlew :target_teavm_wasm_gc:generateWasmGC --console=plain --no-daemon

      - name: Validate generated WASM web output
        run: |
          set -euo pipefail
          WEB="eaglercraft/target_teavm_wasm_gc/build/web"
          test -d "$WEB"
          test -f "$WEB/classes.wasm"
          test -f "$WEB/eagruntime.js"
          test -f "$WEB/index.html"
          find "$WEB" -maxdepth 1 -type f -printf '%f\n' | sort
          echo "Galaxy WASM runtime validation passed."

      - name: Package Galaxy launcher and game
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/game
          cp -R eaglercraft/target_teavm_wasm_gc/build/web/. dist/game/
          cp web/index.html dist/index.html
          cp web/index.html dist/galaxy-launcher.html
          cp web/game.html dist/game.html
          cp README.md dist/README.md
          printf 'Galaxy Client WASM-GC build completed.\n' > dist/BUILD_OK.txt
          test -f dist/game/classes.wasm
          test -f dist/game/eagruntime.js
          test -f dist/game/index.html

      - name: Upload WASM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-client-wasm
          path: dist

  pages:
    if: github.ref == 'refs/heads/main'
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web package
        uses: actions/download-artifact@v4
        with:
          name: galaxy-client-wasm
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
