name: Galaxy Client Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-pages
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx10g -XX:MaxMetaspaceSize=1g"
      JAVA_TOOL_OPTIONS: "-Xmx12g -XX:MaxMetaspaceSize=2g"
    steps:
      - name: Checkout Galaxy Client
        uses: actions/checkout@v4
      - name: Checkout Eaglercraft 26.2 baseline
        uses: actions/checkout@v4
        with:
          repository: Joseytesting/Eaglercraft-26.2-Fabric-API-and
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: eaglercraft
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Check and apply Galaxy source overlay
        run: |
          chmod +x tools/apply-astra.sh
          ./tools/apply-astra.sh eaglercraft
      - name: Compile game sources
        working-directory: eaglercraft
        run: ./gradlew :game:compileJava --console=plain --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g"
      - name: Build browser JavaScript assets
        working-directory: eaglercraft
        run: ./gradlew :target_teavm:generateJavaScript --console=plain --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g"
      - name: Build client WebAssembly GC
        working-directory: eaglercraft
        run: ./gradlew :target_teavm_wasm_gc:generateWasmGC --console=plain --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g"
      - name: Build mesh WebAssembly worker
        working-directory: eaglercraft
        run: ./gradlew :target_teavm_wasm_gc_mesh:generateWasmGC --console=plain --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g"
      - name: Build singleplayer server WebAssembly worker
        working-directory: eaglercraft
        run: ./gradlew :target_teavm_wasm_gc_server:generateWasmGC --console=plain --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g"
      - name: Assemble the real WASM-GC web client
        working-directory: eaglercraft
        env:
          EAGLER_USE_DEDICATED_SERVER_WASM: "1"
        run: bash wasm-toolchain/deploy_wasm_web.sh
      - name: Validate generated playable web output
        run: |
          set -euo pipefail
          WEB="eaglercraft/target_teavm_wasm_gc/build/web"
          test -s "$WEB/index.html"
          test -s "$WEB/classes.wasm"
          test -s "$WEB/classes.wasm-runtime.js"
          test -s "$WEB/mesh-worker.wasm"
          test -s "$WEB/server-worker.wasm"
          test -s "$WEB/assets.epk"
          test -s "$WEB/sounds.epk"
          grep -q "classes.wasm" "$WEB/index.html"
          grep -q "worker-bootstrap.js" "$WEB/index.html"
          echo "Galaxy playable WASM-GC web bundle validated."
      - name: Package Galaxy launcher and game
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/game
          cp -R eaglercraft/target_teavm_wasm_gc/build/web/. dist/game/
          cp web/index.html dist/index.html
          cp web/mods.js dist/mods.js
          cp web/index.html dist/galaxy-launcher.html
          cp web/game.html dist/game.html
          cp README.md dist/README.md
          printf "Galaxy Client WASM-GC playable build completed.\n" > dist/BUILD_OK.txt
          test -s dist/game/index.html
          test -s dist/game/classes.wasm
          test -s dist/game/server-worker.wasm
      - name: Upload WASM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-client-wasm
          path: dist

