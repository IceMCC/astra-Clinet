name: Validate Astra

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Astra sources
        shell: bash
        run: |
          test -f astra/config/AstraConfig.java
          test -f astra/performance/PerformanceController.java
          test -f astra/branding/ClientInfo.java
          echo "Astra source layout OK"
