<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Client</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f4f7ff}
body{background:radial-gradient(circle at 15% 20%,#263c88 0,transparent 35%),radial-gradient(circle at 85% 15%,#4b207e 0,transparent 30%),linear-gradient(135deg,#050816,#0b1024 55%,#120b22);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(120,160,255,.06),transparent 70%);pointer-events:none}
.app{width:min(1180px,94vw);margin:5vh auto;display:grid;grid-template-columns:220px 1fr;min-height:700px;border:1px solid #29375f;border-radius:24px;overflow:hidden;background:rgba(9,14,32,.84);backdrop-filter:blur(22px);box-shadow:0 30px 100px #0008}
nav{padding:25px 16px;border-right:1px solid #29375f;background:#080d1ddd}
.brand{font-size:24px;font-weight:900;margin:5px 10px 30px}.brand span{color:#8aaeff}
.nav{display:grid;gap:8px}.nav button{background:transparent;border:0;color:#aeb9d8;text-align:left;padding:12px 14px;border-radius:12px;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#182448;color:#fff}
main{padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{color:#86a8ff;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.16em}h1{font-size:38px;margin:5px 0 0}.sub{color:#9eabca;margin:8px 0 26px}.card{border:1px solid #2a3860;background:#0d1530cc;border-radius:18px;padding:22px;margin-bottom:18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}.hero strong{font-size:20px}.hero p{color:#aeb9d8}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:#8db0ff;color:#07101f;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mod{padding:14px;border:1px solid #29375d;border-radius:14px;background:#101a36}.mod b{display:block}.mod small{color:#8190b2}.toggle{float:right;width:38px;height:22px;border-radius:20px;background:#27385f;position:relative}.toggle:after{content:"";position:absolute;width:16px;height:16px;top:3px;right:3px;border-radius:50%;background:#8db0ff}.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #2a3962;background:#080f25;color:#fff;margin-bottom:15px;outline:none}.status{color:#94a6cb;font-size:13px}
@media(max-width:800px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}nav{border-right:0;border-bottom:1px solid #29375f}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center}}
</style></head>
<body>
<div class="app">
<nav><div class="brand">✦ Galaxy <span>Client</span></div><div class="nav">
<button class="active" data-page="home">Home</button><button data-page="mods">Mods</button><button data-page="performance">Performance</button><button data-page="settings">Settings</button>
</div></nav>
<main><div class="top"><div><div class="eyebrow">Galaxy Client • 0.1.0-dev</div><h1 id="title">Welcome back</h1><p class="sub" id="sub">A modern performance-first Eaglercraft client.</p></div><button class="btn" id="play">Play</button></div>
<section id="content"></section></main>
</div>
<script>
const mods=[{"name":"FPS Boost","cat":"performance"},{"name":"Entity Culling","cat":"performance"},{"name":"Particle Optimizer","cat":"performance"},{"name":"Dynamic FPS","cat":"performance"},{"name":"Fast Math","cat":"performance"},{"name":"Chunk Culling","cat":"performance"},{"name":"Render Distance","cat":"performance"},{"name":"Smart Animations","cat":"performance"},{"name":"Lazy Chunk Loading","cat":"performance"},{"name":"Fast World Load","cat":"performance"},{"name":"Memory Optimizer","cat":"performance"},{"name":"Texture Cache","cat":"performance"},{"name":"Model Cache","cat":"performance"},{"name":"Shader Cache","cat":"performance"},{"name":"Font Cache","cat":"performance"},{"name":"Light Cache","cat":"performance"},{"name":"Occlusion Culling","cat":"performance"},{"name":"Frustum Culling","cat":"performance"},{"name":"Block Culling","cat":"performance"},{"name":"Mob Culling","cat":"performance"},{"name":"Item Entity Culling","cat":"performance"},{"name":"Sign Culling","cat":"performance"},{"name":"Cloud Culling","cat":"performance"},{"name":"Weather Optimizer","cat":"performance"},{"name":"Sky Optimizer","cat":"performance"},{"name":"Fog Optimizer","cat":"performance"},{"name":"Biome Cache","cat":"performance"},{"name":"Chunk Mesh Cache","cat":"performance"},{"name":"World Renderer","cat":"performance"},{"name":"Render Batching","cat":"performance"},{"name":"Texture Animation Control","cat":"performance"},{"name":"Particle Limit","cat":"performance"},{"name":"Entity Tick Optimizer","cat":"performance"},{"name":"Block Entity Optimizer","cat":"performance"},{"name":"Redstone Optimizer","cat":"performance"},{"name":"Pathfinding Optimizer","cat":"performance"},{"name":"AI Tick Optimizer","cat":"performance"},{"name":"Random Tick Optimizer","cat":"performance"},{"name":"Sound Optimizer","cat":"performance"},{"name":"Network Optimizer","cat":"performance"},{"name":"Packet Compression","cat":"performance"},{"name":"Connection Stabilizer","cat":"performance"},{"name":"Ping Display","cat":"utility"},{"name":"FPS Display","cat":"utility"},{"name":"CPS Display","cat":"utility"},{"name":"Keystrokes","cat":"utility"},{"name":"Armor HUD","cat":"utility"},{"name":"Potion HUD","cat":"utility"},{"name":"Coordinates","cat":"utility"},{"name":"Clock","cat":"utility"},{"name":"Session Time","cat":"utility"},{"name":"Memory HUD","cat":"utility"},{"name":"Server Info","cat":"utility"},{"name":"Biome Display","cat":"utility"},{"name":"Direction HUD","cat":"utility"},{"name":"Reach Display","cat":"utility"},{"name":"Durability HUD","cat":"utility"},{"name":"Item Counter","cat":"utility"},{"name":"Crosshair","cat":"visual"},{"name":"Hit Color","cat":"visual"},{"name":"Damage Indicator","cat":"visual"},{"name":"Block Overlay","cat":"visual"},{"name":"Motion Blur","cat":"visual"},{"name":"Fullbright","cat":"visual"},{"name":"Clear Water","cat":"visual"},{"name":"Low Fire","cat":"visual"},{"name":"No Pumpkin Overlay","cat":"visual"},{"name":"Minimal Particles","cat":"visual"},{"name":"Minimal HUD","cat":"visual"},{"name":"Clean Scoreboard","cat":"visual"},{"name":"Chat Timestamps","cat":"utility"},{"name":"Chat Filter","cat":"utility"},{"name":"Compact Chat","cat":"utility"},{"name":"Chat Background","cat":"visual"},{"name":"Screenshot Helper","cat":"utility"},{"name":"Zoom","cat":"utility"},{"name":"Perspective","cat":"utility"},{"name":"Toggle Sprint","cat":"utility"},{"name":"Toggle Sneak","cat":"utility"},{"name":"Auto Reconnect","cat":"utility"},{"name":"Server Selector","cat":"utility"},{"name":"Quick Play","cat":"utility"},{"name":"Favorite Servers","cat":"utility"},{"name":"Mod Profiles","cat":"utility"},{"name":"Keybind Manager","cat":"utility"},{"name":"Config Manager","cat":"utility"},{"name":"Notifications","cat":"visual"},{"name":"FPS Graph","cat":"utility"},{"name":"Performance Graph","cat":"utility"},{"name":"Lag Meter","cat":"utility"},{"name":"World Time","cat":"utility"},{"name":"Compact Inventory","cat":"visual"},{"name":"Inventory Search","cat":"utility"},{"name":"Item Preview","cat":"visual"},{"name":"Tooltips","cat":"visual"},{"name":"Name Tags","cat":"visual"},{"name":"Entity Info","cat":"utility"},{"name":"Chunk Borders","cat":"visual"},{"name":"Grid Overlay","cat":"visual"},{"name":"Debug Panel","cat":"utility"}];
const content=document.getElementById('content');
function render(page='home'){
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='mods'){document.getElementById('title').textContent='Mods';document.getElementById('sub').textContent='100 Galaxy modules • performance, utility and visual controls';content.innerHTML='<div class="card"><input class="search" id="search" placeholder="Search 100 mods..."><div class="grid" id="mods"></div></div>';drawMods('');document.getElementById('search').oninput=e=>drawMods(e.target.value.toLowerCase());}
else if(page==='performance'){document.getElementById('title').textContent='Performance';document.getElementById('sub').textContent='Tune the client for smoother browser gameplay.';content.innerHTML='<div class="card"><div class="hero"><div><strong>High FPS preset</strong><p>Entity culling • particle reduction • dynamic FPS • fast math</p></div><button class="btn" onclick="alert(\'Performance preset selected\')">Apply</button></div></div><div class="grid">'+['Entity Culling','Particle Reduction','Dynamic FPS','Fast Math','Animated Textures','Render Distance'].map(x=>'<div class="mod"><b>'+x+'</b><small>Galaxy optimization</small><span class="toggle"></span></div>').join('')+'</div>';}
else if(page==='settings'){document.getElementById('title').textContent='Settings';document.getElementById('sub').textContent='Client preferences and profiles.';content.innerHTML='<div class="card"><h3>Profile</h3><p class="status">High FPS is the default. Custom mode is available through the client settings model.</p></div><div class="card"><h3>Build</h3><p class="status">Playable browser builds require a compatible Eaglercraft source/input set that you are licensed to use.</p></div>';}
else{document.getElementById('title').textContent='Welcome back';document.getElementById('sub').textContent='A modern performance-first Eaglercraft client.';content.innerHTML='<div class="card hero"><div><strong>Galaxy Client is ready</strong><p>Open Mods to manage the 100-module catalog or Performance to tune FPS.</p></div><button class="btn" onclick="render(\'mods\')">Open Mods</button></div><div class="grid"><div class="mod"><b>100 Mods</b><small>Catalog ready</small></div><div class="mod"><b>High FPS</b><small>Default profile</small></div><div class="mod"><b>Modern UI</b><small>Galaxy glass theme</small></div></div>'}}
function drawMods(q){document.getElementById('mods').innerHTML=mods.filter(m=>m.name.toLowerCase().includes(q)||m.cat.includes(q)).map(m=>'<div class="mod"><span class="toggle"></span><b>'+m.name+'</b><small>'+m.cat+'</small></div>').join('')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));document.getElementById('play').onclick=()=>alert('The launcher UI is ready. The actual playable Eaglercraft bundle still needs the licensed build inputs.');render();
</script></body></html>
